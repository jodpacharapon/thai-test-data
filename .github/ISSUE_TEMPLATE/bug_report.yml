name: Bug report
description: ข้อมูลที่ generate ออกมาผิด หรือ web app/library ทำงานไม่ถูกต้อง
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Description
      description: เกิดอะไรขึ้น และควรจะเป็นแบบไหน (expected vs actual)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: ขั้นตอนหรือ code ที่ใช้ ถ้าใส่ seed ด้วยจะช่วยได้มาก
      placeholder: |
        const td = createThaiData({ seed: 42 });
        td.citizenId();
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Web app
        - Library (npm)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: version ของ package หรือ browser ที่ใช้
