name: Bug report
description: ข้อมูลที่สร้างผิด หรือ web app/library ทำงานไม่ถูกต้อง
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: เกิดอะไรขึ้น
      description: อธิบายสิ่งที่เห็น และสิ่งที่ควรจะเป็น
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: วิธีทำให้เกิดซ้ำ
      description: ขั้นตอนหรือโค้ดที่ใช้ ถ้าใส่ seed ด้วยจะช่วยได้มาก
      placeholder: |
        const td = createThaiData({ seed: 42 });
        td.citizenId();
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: เจอที่ไหน
      options:
        - Web app
        - Library (npm)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: เวอร์ชัน
      description: เวอร์ชันของแพ็กเกจ หรือเบราว์เซอร์ที่ใช้
