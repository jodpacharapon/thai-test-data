name: Feature request
description: ขอชนิดข้อมูลใหม่ กรณีผิดแบบใหม่ หรือฟีเจอร์อื่น
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: อยากได้อะไร
      description: เช่น เลขบัญชีธนาคาร, ทะเบียนรถ, รหัสไปรษณีย์ที่ไม่ตรงอำเภอ
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: กฎการตรวจ (validation rule)
      description: ระบบจริงตรวจข้อมูลนี้ยังไง ถ้ามีลิงก์อ้างอิงยิ่งดี
  - type: textarea
    id: usecase
    attributes:
      label: จะเอาไปเทสอะไร
      description: ช่วยให้เข้าใจว่าควรมีตัวเลือกอะไรบ้าง
