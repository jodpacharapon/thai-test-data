name: Feature request
description: ขอ data type ใหม่ invalid case แบบใหม่ หรือ feature อื่น
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Request
      description: เช่น เลขบัญชีธนาคาร, ทะเบียนรถ, รหัสไปรษณีย์ที่ไม่ตรงอำเภอ
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: Validation rule
      description: ระบบจริง validate ข้อมูลนี้ยังไง มี link reference ยิ่งดี
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: จะเอาไปใช้ test อะไร ช่วยให้รู้ว่าควรมี option อะไรบ้าง
